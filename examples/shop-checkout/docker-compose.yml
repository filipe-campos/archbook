services:
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    environment:
      ORDERS_API_URL: http://orders-api:4000

  orders-api:
    build: ./services/orders-api
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on: [postgres, redis]

  outbox-relay:
    build: ./workers/outbox-relay
    environment:
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]

  payment-worker:
    build: ./workers/payment-worker
    environment:
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on: [redis]

  notifications-worker:
    build: ./workers/notifications-worker
    environment:
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      REDIS_URL: redis://redis:6379
      POSTMARK_TOKEN: ${POSTMARK_TOKEN}
    depends_on: [postgres, redis]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
